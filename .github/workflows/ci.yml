name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Unit tests (pure-Python engine, no QGIS needed)
        run: python -m unittest discover -s sfca_accessibility/tests -v
      - name: Compile all modules
        run: python -m compileall -q sfca_accessibility
      - name: Build installable plugin zip
        run: |
          mkdir dist
          zip -r dist/sfca_accessibility.zip sfca_accessibility -x '*/__pycache__/*' '*/tests/*'
      - uses: actions/upload-artifact@v4
        with: { name: sfca_accessibility-plugin, path: dist/sfca_accessibility.zip }
